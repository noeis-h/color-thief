<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Thief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div class="hud">
      <div class="lvl"><span id="lvl">스테이지 1</span></div>
      <div class="title">
        <h1>COLOR THIEF</h1>
        <div class="gems"><span class="ln"></span><i class="r"></i><b></b><i class="bl"></i><b></b><i class="y"></i><span class="ln"></span></div>
      </div>
      <div class="tools">
        <button class="sq" id="helpBtn" aria-label="플레이 방법" title="플레이 방법">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M9.2 9.6a3.9 3.9 0 1 1 5.6 3.5c-1.1.5-1.8 1.4-1.8 2.6v.8" /><circle cx="13" cy="20.4" r=".6" fill="currentColor" />
          </svg>
        </button>
        <button class="sq" id="levelsBtn" aria-label="스테이지 선택" title="스테이지 선택">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3.5l4.5 4.5L8 12.5 3.5 8zM18 3.5l4.5 4.5-4.5 4.5L13.5 8zM8 13.5l4.5 4.5L8 22.5 3.5 18zM18 13.5l4.5 4.5-4.5 4.5-4.5-4.5z" />
          </svg>
        </button>
        <button class="sq" id="undoBtn" aria-label="한 걸음 되돌리기" title="되돌리기 (Z)">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6L4 11l5 5" /><path d="M4.5 11H15a6.5 6.5 0 0 1 0 13h-3" />
          </svg>
        </button>
        <button class="sq" id="restart" aria-label="처음부터 다시" title="재시작 (R)">
          <svg width="28" height="28" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M22.5 9.5A10 10 0 1 1 15 5" />
            <path d="M15 1.5v7M11.5 5h7" />
          </svg>
        </button>
      </div>
      <div class="carry" id="carry">
        <span class="ln"></span>
        <div class="pill"><i id="carryGem"></i><span>보유 색&nbsp;&nbsp;<em id="carryTxt">없음</em></span></div>
        <span class="ln"></span>
      </div>
      <button class="hintbtn" id="hintBtn" aria-label="힌트" title="힌트 (H)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.8 1.1.8 1.9V16h6v-.8c0-.8.3-1.4.9-1.9A6.5 6.5 0 0 0 12 2.5z" /></svg>
        <span>힌트</span><span class="stars" id="hintStars"></span>
      </button>
      <div class="keys">클릭: 이동 &nbsp;·&nbsp; SPACE: 옆 칸의 색 훔치기 / 주기 &nbsp;·&nbsp; Z: 되돌리기 &nbsp;·&nbsp; R: 재시작</div>
    </div>

    <div id="card"><div class="cl" id="cardLvl"></div><div class="cn" id="cardName"></div><div class="ch" id="cardHint"></div></div>
    <div id="fade"></div>

    <!-- how to play -->
    <div class="modal" id="help" role="dialog" aria-label="플레이 방법">
      <div class="panel guide">
        <button class="close" data-close aria-label="닫기">×</button>
        <div class="eyebrow">플레이 방법</div>
        <h2 id="guideTitle"></h2>
        <div class="guide-art" id="guideArt"></div>
        <p class="guide-text" id="guideText"></p>
        <div class="guide-nav">
          <button class="btn ghost" id="guidePrev">이전</button>
          <div class="dots" id="guideDots"></div>
          <button class="btn" id="guideNext">다음</button>
        </div>
      </div>
    </div>

    <!-- hints -->
    <div class="modal" id="hints" role="dialog" aria-label="힌트">
      <div class="panel hints-panel">
        <button class="close" data-close aria-label="닫기">×</button>
        <div class="eyebrow">힌트</div>
        <div class="stars big" id="hintsStars"></div>
        <p class="sub">힌트를 하나 볼 때마다 이번 클리어의 별이 하나씩 줄어듭니다.</p>
        <div id="hintsList"></div>
      </div>
    </div>

    <!-- level select -->
    <div class="modal" id="levels" role="dialog" aria-label="스테이지 선택">
      <div class="panel levels-panel">
        <button class="close" data-close aria-label="닫기">×</button>
        <div class="eyebrow">스테이지</div>
        <div class="total" id="levelTotal"></div>
        <div class="level-grid" id="levelGrid"></div>
        <div class="saved-note">진행 상황은 이 기기에 자동으로 저장됩니다</div>
        <button class="btn ghost danger" id="resetProgress">진행 초기화</button>
      </div>
    </div>

    <!-- level clear -->
    <div class="modal" id="result" role="dialog" aria-label="스테이지 클리어">
      <div class="panel result-panel">
        <div class="eyebrow" id="resultLvl"></div>
        <h2 id="resultName"></h2>
        <div class="stars result-stars" id="resultStars"></div>
        <div class="sub" id="resultNote"></div>
        <div class="result-actions">
          <button class="btn ghost" id="resultReplay">다시 하기</button>
          <button class="btn" id="resultNext">다음 스테이지</button>
        </div>
      </div>
    </div>

    <!-- all stages cleared -->
    <div class="modal" id="ending" role="dialog" aria-label="모든 스테이지 클리어">
      <div class="panel result-panel">
        <div class="eyebrow">모든 스테이지 클리어</div>
        <h2 class="clear-title">CLEAR</h2>
        <div class="total ending-total" id="endingTotal"></div>
        <div class="sub">모든 색이 제자리로 돌아왔습니다. 처음부터 다시 하시겠습니까?</div>
        <div class="result-actions">
          <button class="btn ghost" id="endingLevels">스테이지 선택</button>
          <button class="btn" id="endingReplay">처음부터 다시</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
